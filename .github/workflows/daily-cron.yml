name: Forecast Cron Manual (Respaldo)

# Este workflow es SOLO para ejecución manual (workflow_dispatch).
# La automatización principal corre via Vercel Cron Jobs (vercel.json).
# GitHub Actions schedule es poco confiable para crons nocturnos.
# Mantener como respaldo manual si Vercel falla.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Qué ejecutar: daily o backfill'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - backfill

jobs:
  run-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Corrida principal (forecast + backfill reales + snapshots)
        if: inputs.action == 'daily'
        run: |
          echo "=== CORRIDA MANUAL $(date -u) ==="
          curl -sS --max-time 300 -X GET \
            "${{ secrets.VERCEL_URL }}/api/cron/daily" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

      - name: Backfill temperaturas reales + snapshots
        if: inputs.action == 'backfill'
        run: |
          echo "=== BACKFILL MANUAL $(date -u) ==="
          curl -sS --max-time 120 -X POST \
            "${{ secrets.VERCEL_URL }}/api/backfill?limit=200" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          echo ""
          echo "=== BACKFILL SNAPSHOTS ==="
          curl -sS --max-time 120 -X POST \
            "${{ secrets.VERCEL_URL }}/api/cron/backfill-reales" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Log resultado
        if: always()
        run: |
          echo "Workflow completado: $(date -u)"
