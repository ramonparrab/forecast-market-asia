name: Forecast Cron (Backup Manual)

# DESACTIVADO: Los crones automáticos corren en Vercel (vercel.json).
# Este workflow se conserva SOLO para ejecución manual (workflow_dispatch).
# El cron schedule se eliminó para evitar doble ejecución con Vercel.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Qué ejecutar: daily o backfill'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - backfill

jobs:
  run-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ejecutar acción
        run: |
          ACTION="${{ github.event.inputs.action }}"
          echo "Ejecutando: $ACTION (manual, $(date -u))"

          if [ "$ACTION" = "daily" ]; then
            echo "=== CORRIDA PRINCIPAL ==="
            curl -sS --max-time 300 -X GET \
              "${{ secrets.VERCEL_URL }}/api/cron/daily" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json"
          elif [ "$ACTION" = "backfill" ]; then
            echo "=== BACKFILL REALES ==="
            curl -sS --max-time 120 -X POST \
              "${{ secrets.VERCEL_URL }}/api/backfill?limit=200" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
            echo ""
            echo "=== BACKFILL SNAPSHOTS ==="
            curl -sS --max-time 120 -X POST \
              "${{ secrets.VERCEL_URL }}/api/cron/backfill-reales" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          fi

      - name: Log resultado
        if: always()
        run: |
          echo "Workflow completado: $(date -u)"
